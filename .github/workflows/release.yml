name: Release

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # Reusable CI checks the event commit; build below separately tests the exact
  # selected tag, including when manually publishing an older tag.
  checks:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate tag and version
        id: metadata
        run: python3 scripts/release-metadata.py
      - name: Record exact source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y restic
      - name: Test selected tag and build binaries
        env:
          KEEPSYNC_REQUIRE_INTEGRATION: '1'
        run: |
          make check build release
          test "$(bin/keepsync version)" = "KeepSync $(tr -d '\n' < VERSION)"
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  container:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image:$VERSION"
            if [ "$PRERELEASE" = false ]; then echo "$image:latest"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          build-args: VERSION=${{ needs.build.outputs.version }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ needs.build.outputs.sha }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [build, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: dist
      - run: sha256sum --check --strict SHA256SUMS
        working-directory: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/keepsync_*
      - name: Publish GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')" = "$SOURCE_SHA"
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" keepsync_* SHA256SUMS \
            --repo "$GH_REPO" --verify-tag --title "KeepSync $RELEASE_TAG 🐳" \
            --generate-notes "${flags[@]}"
