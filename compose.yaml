services:
  keepsync:
    image: ${KEEPSYNC_IMAGE:-mayankfawkes/keepsync:0.3.0}
    restart: unless-stopped
    cpus: ${KEEPSYNC_CPUS:-0.5}
    mem_limit: ${KEEPSYNC_MEMORY_LIMIT:-256m}
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      KEEPSYNC_DATASET: ${KEEPSYNC_DATASET:-files}
      KEEPSYNC_TARGET: ${KEEPSYNC_TARGET:?Set KEEPSYNC_TARGET to s3://bucket/prefix}
      KEEPSYNC_METHOD: ${KEEPSYNC_METHOD:-live}
      KEEPSYNC_INTERVAL: ${KEEPSYNC_INTERVAL:-1h}
      KEEPSYNC_DEBOUNCE: ${KEEPSYNC_DEBOUNCE:-30s}
      KEEPSYNC_MAX_WAIT: ${KEEPSYNC_MAX_WAIT:-5m}
      KEEPSYNC_SNAPSHOTS_ENABLED: ${KEEPSYNC_SNAPSHOTS_ENABLED:-true}
      KEEPSYNC_SNAPSHOT_FORMAT: tar
      KEEPSYNC_SNAPSHOT_INTERVAL: ${KEEPSYNC_SNAPSHOT_INTERVAL:-30m}
      KEEPSYNC_SNAPSHOT_RETAIN: ${KEEPSYNC_SNAPSHOT_RETAIN:-7}
      KEEPSYNC_LOG_FORMAT: ${KEEPSYNC_LOG_FORMAT:-text}
      KEEPSYNC_LOG_FILES: ${KEEPSYNC_LOG_FILES:-true}
      KEEPSYNC_DELETE_REMOTE: ${KEEPSYNC_DELETE_REMOTE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - type: bind
        source: ${KEEPSYNC_SOURCE:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - state:/var/lib/keepsync
    tmpfs:
      - /tmp:mode=1777,size=16m
    stop_grace_period: 1m

volumes:
  state:
